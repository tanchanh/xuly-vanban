<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chuyển Đổi Văn Bản - D.T.Chánh</title>
    <style>
        /* ==========================================================================
           1. THIẾT LẬP NỀN TẢNG & BIẾN TOÀN CỤC (:root, Reset, Body)
           ========================================================================== */
        :root {
            --bg-color: #f7f9fc;
            --border-color: #afafaf;
            --text-color: #333333;
            --primary-color: #007bff;
            --gray-color: #6c757d;
            --button-hover: #0056b3;
            --success-color: #28a745;
            --success-hover: #218838;
            --info-color: #17a2b8;
            --info-hover: #138496;
            --font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            --border-radius: 0.5rem;
            --border-radius-sm: 0.375rem;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 1rem 1rem 5rem 1rem;
            margin: 0 auto;
            max-width: 50rem;
        }

        /* ==========================================================================
           2. TIÊU ĐỀ & THÔNG TIN TÁC GIẢ
           ========================================================================== */
        h1 {
            font-size: 1.6rem;
            font-weight: bold;
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 0.3rem;
        }

        .author {
            text-align: right;
            font-weight: bold;
            font-size: 1.1rem;
            color: #4a5568;
            margin-top: -0.5rem;
            margin-bottom: 1.2rem;
        }

        /* ==========================================================================
           3. BỐ CỤC CHUNG & VÙNG NHẬP LIỆU (Input Section)
           ========================================================================== */
        .input-area-wrapper {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            margin-bottom: 2rem;
            width: 100%;
        }

        .input-section {
            position: relative;
            width: 100%;
        }

        #inputText {
            width: 100%;
            height: 12.5rem;
            padding: 1rem;
            font-size: 1.2rem;
            font-family: var(--font-family);
            border: 2px solid var(--border-color);
            border-radius: var(--border-radius);
            resize: vertical;
            transition: border-color 0.3s;
            outline: none;
            display: block;
        }

        #inputText:focus {
            border-color: var(--primary-color);
        }

        /* Style chung cho nút bấm */
        button {
            border: none;
            padding: 0.5rem 1rem;
            font-size: 1.2rem;
            border-radius: var(--border-radius-sm);
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s, color 0.3s;
            width: fit-content;
            color: white;
        }

        button:active {
            transform: scale(0.97);
        }

        #clearButton {
            background-color: var(--gray-color);
        }

        #clearButton:hover {
            background-color: #5a6268;
        }

        /* Nút Dán khi ô nhập trống */
        #clearButton.paste-mode {
            background-color: var(--success-color);
        }

        #clearButton.paste-mode:hover {
            background-color: var(--success-hover);
        }

        .input-actions {
            display: flex;
            gap: 0.8rem;
        }

        #cleanSpacesButton {
            background-color: var(--info-color);
        }

        #cleanSpacesButton:hover {
            background-color: var(--info-hover);
        }

        /* ==========================================================================
           4. BỘ ĐẾM KÝ TỰ / TỪ (Counters)
           ========================================================================== */
        .counters {
            position: absolute;
            bottom: 0.6rem;
            right: 0.6rem;
            font-size: 0.9em;
            color: #999;
            text-align: right;
            pointer-events: none;
            user-select: none;
        }

        /* ==========================================================================
           5. VÙNG KẾT QUẢ ĐẦU RA (Output Sections)
           ========================================================================== */
        .output-container {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            width: 100%;
        }

        .output-section {
            width: 100%;
        }

        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
            gap: 1rem;
        }

        .output-header h2 {
            font-size: 1.2rem;
            font-weight: bold;
            margin: 0;
        }

        .copy-btn {
            background-color: var(--primary-color);
            padding: 0.4rem 0.8rem;
            /* Nút copy nhỏ hơn một chút */
        }

        .copy-btn:hover {
            background-color: var(--button-hover);
        }

        .output-box {
            background: #f0f4f8;
            padding: 1rem;
            border: 2px solid var(--border-color);
            border-radius: var(--border-radius);
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 1.2rem;
            min-height: 3rem;
        }

        /* ==========================================================================
           6. THÔNG BÁO TẠM THỜI (Toast Notification)
           ========================================================================== */
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #4CAF50;
            color: white;
            text-align: center;
            padding: 0.9rem 1.9rem;
            border-radius: var(--border-radius);
            box-shadow: 0 0.3rem 0.8rem rgba(0, 0, 0, 0.25);
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
        }
    </style>
</head>

<body>
    <div id="toastMessage" class="toast"></div>
    <h1>Chuyển Đổi Văn Bản</h1>
    <div class="author">D.T.Chánh</div>

    <div class="input-area-wrapper">
        <div class="input-section">
            <textarea id="inputText" placeholder="Nhập văn bản tiếng Việt của bạn vào đây..." autofocus></textarea>
            <div class="counters">
                <div id="charCount">0 ký tự</div>
                <div id="wordCount">0 từ</div>
            </div>
        </div>
        <div class="input-actions">
            <button id="clearButton">Xóa</button>
            <button id="cleanSpacesButton">Xoá khoảng trắng</button>
        </div>
    </div>

    <div class="output-container">
        <div class="output-section">
            <div class="output-header">
                <h2>1. CHUYỂN THÀNH CHỮ IN HOA</h2>
                <button class="copy-btn" data-target="outputUppercase">Sao chép</button>
            </div>
            <div id="outputUppercase" class="output-box"></div>
        </div>
        <div class="output-section">
            <div class="output-header">
                <h2>2. Viết Hoa Chữ Cái Đầu Mỗi Từ</h2>
                <button class="copy-btn" data-target="outputTitleCase">Sao chép</button>
            </div>
            <div id="outputTitleCase" class="output-box"></div>
        </div>
        <div class="output-section">
            <div class="output-header">
                <h2>3. chuyển thành chữ thường</h2>
                <button class="copy-btn" data-target="outputLowercase">Sao chép</button>
            </div>
            <div id="outputLowercase" class="output-box"></div>
        </div>
        <div class="output-section">
            <div class="output-header">
                <h2>4. Viết hoa đầu câu.</h2>
                <button class="copy-btn" data-target="outputSentenceCase">Sao chép</button>
            </div>
            <div id="outputSentenceCase" class="output-box"></div>
        </div>
        <div class="output-section">
            <div class="output-header">
                <h2>5. Đổi thành tên file hợp lệ</h2>
                <button class="copy-btn" data-target="outputFilename">Sao chép</button>
            </div>
            <div id="outputFilename" class="output-box"></div>
        </div>
        <div class="output-section">
            <div class="output-header">
                <h2>6. Tạo #hashtag cho dòng cuối</h2>
                <button class="copy-btn" data-target="outputHashtag">Sao chép</button>
            </div>
            <div id="outputHashtag" class="output-box"></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputText = document.getElementById('inputText');
            const charCount = document.getElementById('charCount');
            const wordCount = document.getElementById('wordCount');
            const clearButton = document.getElementById('clearButton');
            const cleanSpacesButton = document.getElementById('cleanSpacesButton');
            const outputHashtag = document.getElementById('outputHashtag');
            const outputUppercase = document.getElementById('outputUppercase');
            const outputLowercase = document.getElementById('outputLowercase');
            const outputTitleCase = document.getElementById('outputTitleCase');
            const outputSentenceCase = document.getElementById('outputSentenceCase');
            const outputFilename = document.getElementById('outputFilename');
            const copyButtons = document.querySelectorAll('.copy-btn');
            const toastMessage = document.getElementById('toastMessage');

            function showToast(message) {
                toastMessage.textContent = message;
                toastMessage.classList.add('show');
                setTimeout(() => {
                    toastMessage.classList.remove('show');
                }, 2000);
            }

            function toHashtag(text) {
                const lines = text.split('\n').filter(line => line.trim() !== '');
                if (lines.length === 0) return text;
                const lastLine = lines[lines.length - 1];
                const otherLines = lines.slice(0, -1).join('\n');
                const processedLastLine = lastLine
                    .replace(/\s{2,}/g, ' ')
                    .replace(/[#,.!?;:]/g, '')
                    .trim()
                    .split(' ')
                    .map(word => `#${word}`)
                    .join(' ');
                if (otherLines) {
                    return `${otherLines}\n${processedLastLine}`;
                } else {
                    return processedLastLine;
                }
            }

            function toTitleCase(text) {
                if (!text) return '';
                return text.normalize('NFC')
                    .toLowerCase()
                    .replace(/(^|\s)(\p{L})/gu, function (match, p1, p2) {
                        return p1 + p2.toUpperCase();
                    });
            }

            function toSentenceCase(text) {
                if (!text) return '';
                let processedText = text.normalize('NFC');
                if (processedText === processedText.toUpperCase() || processedText === processedText.toLowerCase()) {
                    processedText = processedText.toLowerCase();
                }
                return processedText.replace(/(^\s*|[.!?]\s+|\n\s*)([\p{L}\p{N}])/gu, function (match, p1, p2) {
                    return p1 + p2.toUpperCase();
                });
            }

            function toValidFilename(text) {
                const invalidChars = /[<>:"/\\|?*\x00-\x1F]/g;
                return text.replace(invalidChars, ' ')
                    .replace(/\s{2,}/g, ' ')
                    .trim();
            }

            function countWords(text) {
                const trimmedText = text.trim();
                if (!trimmedText) return 0;
                return trimmedText.split(/\s+/).filter(word => word.length > 0).length;
            }

            function updateConversions() {
                const text = inputText.value;
                charCount.textContent = `${text.length} ký tự`;
                wordCount.textContent = `${countWords(text)} từ`;
                outputHashtag.textContent = toHashtag(text);
                outputUppercase.textContent = text.toUpperCase();
                outputLowercase.textContent = text.toLowerCase();
                outputTitleCase.textContent = toTitleCase(text);
                outputSentenceCase.textContent = toSentenceCase(text);
                outputFilename.textContent = toValidFilename(text);

                // Cập nhật trạng thái nút Xoá / Dán
                if (text.length === 0) {
                    clearButton.textContent = 'Dán';
                    clearButton.classList.add('paste-mode');
                } else {
                    clearButton.textContent = 'Xóa';
                    clearButton.classList.remove('paste-mode');
                }
            }

            inputText.addEventListener('input', updateConversions);
            clearButton.addEventListener('click', () => {
                if (inputText.value.length === 0) {
                    // Trạng thái Dán: Đọc dữ liệu từ clipboard
                    if (navigator.clipboard && navigator.clipboard.readText) {
                        navigator.clipboard.readText()
                            .then(clipText => {
                                inputText.value = clipText;
                                updateConversions();
                                inputText.focus();
                                showToast('Đã dán văn bản từ clipboard!');
                            })
                            .catch(err => {
                                console.error('Lỗi khi truy cập clipboard:', err);
                                showToast('Không có quyền truy cập clipboard!');
                            });
                    } else {
                        showToast('Trình duyệt không hỗ trợ dán tự động!');
                    }
                } else {
                    // Trạng thái Xóa: Xóa sạch dữ liệu
                    inputText.value = '';
                    updateConversions();
                    inputText.focus();
                }
            });

            cleanSpacesButton.addEventListener('click', () => {
                const text = inputText.value;
                if (text) {
                    inputText.value = text.split('\n')
                        .map(line => line.trim().replace(/[ \t]{2,}/g, ' '))
                        .join('\n')
                        .trim();
                    updateConversions();
                    inputText.focus();
                    showToast('Đã dọn dẹp khoảng trắng thừa!');
                }
            });

            copyButtons.forEach(button => {
                button.addEventListener('click', (event) => {
                    const targetId = event.target.dataset.target;
                    const targetElement = document.getElementById(targetId);
                    if (targetElement) {
                        const textToCopy = targetElement.textContent || targetElement.innerText;
                        if (navigator.clipboard && window.isSecureContext) {
                            navigator.clipboard.writeText(textToCopy)
                                .then(() => {
                                    showToast('Đã sao chép vào clipboard!');
                                })
                                .catch(err => {
                                    console.error('Lỗi khi sao chép:', err);
                                });
                        } else {
                            const tempTextArea = document.createElement('textarea');
                            tempTextArea.value = textToCopy;
                            document.body.appendChild(tempTextArea);
                            tempTextArea.select();
                            try {
                                document.execCommand('copy');
                                showToast('Đã sao chép vào clipboard!');
                            } catch (err) {
                                console.error('Lỗi khi sao chép:', err);
                            }
                            document.body.removeChild(tempTextArea);
                        }
                    }
                });
            });

            updateConversions();
        });
    </script>
</body>

</html>
